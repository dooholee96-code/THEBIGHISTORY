# 공개 데이터 대조 — Wikidata·Cliopatria 와 우리 항목을 견준 리포트를 만든다.
# 손으로 실행(Actions 탭 → sources → Run workflow)하거나 매주 월요일 새벽에 돈다.
# 결과(data/review/)는 data-review 브랜치에 올라가고, 실행 결과의 Artifacts 에서도 내려받을 수 있다.
# 데이터 파일(data/*.json)은 바꾸지 않는다 — 고칠지는 리포트를 보고 사람이 정한다.
name: sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0'   # 매주 월요일 03:17 (한국 시각)

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wikidata·Cliopatria 대조
        run: node scripts/match-wikidata.js
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.run_number }}
          path: data/review/
      - name: 리포트를 data-review 브랜치에
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r data/review /tmp/review
          rm -rf data/review   # 브랜치를 바꿀 때 같은 이름의 파일과 부딪치지 않게
          git fetch origin data-review || true
          if git show-ref --quiet refs/remotes/origin/data-review; then
            git checkout -B data-review origin/data-review
          else
            git checkout --orphan data-review
            git rm -rq --cached . && git clean -fdq
          fi
          rm -rf data && mkdir -p data && cp -r /tmp/review data/review
          git add data/review
          git commit -m "대조 리포트 ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" || echo "바뀐 것 없음"
          git push origin data-review
